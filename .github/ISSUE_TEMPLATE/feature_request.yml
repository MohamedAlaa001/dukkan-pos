name: Feature request
description: Suggest an improvement for Dukkan.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What shop workflow needs improving?
      description: Explain who needs this and the problem they encounter.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the result you want and any alternatives considered.
    validations:
      required: true
